name: MeisterAI
options:
  bundleIdPrefix: com.maf4711
  developmentLanguage: de
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_NAME: MeisterAI
    MARKETING_VERSION: "6.26.0"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGNING_REQUIRED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_CFBundleDisplayName: MeisterAI
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © maf4711"
    INFOPLIST_KEY_LSUIElement: "NO"
    COMBINE_HIDPI_IMAGES: "YES"
targets:
  MeisterAI:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maf4711.meisterai
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleName: MeisterAI
        CFBundleDisplayName: MeisterAI
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSSupportsAutomaticGraphicsSwitching: true
  MeisterAITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: MeisterAI
    settings:
      base:
        PRODUCT_NAME: MeisterAITests
        PRODUCT_BUNDLE_IDENTIFIER: com.maf4711.meisterai.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MeisterAI:
    build:
      targets:
        MeisterAI: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: MeisterAITests
          parallelizable: false
      environmentVariables:
        MEISTER_DISABLE_STARTUP_CHECKS: '1'
